<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Churchill's Boxing Gym — Before &amp; New Design</title>
<meta name="description" content="Side-by-side review of the Churchill's Boxing Gym website: the original site and the new design.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root{
    --paper:#f4f2ee;
    --mist:#e8e5df;
    --ink:#2f3338;
    --slate:#5a5f66;
    --sage:#7f8c85;
    --sage-2:#6d7a72;
    --clay:#a4937e;
    --line:rgba(47,51,56,.13);
    --bar-h:56px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif;font-size:15px;
    display:flex;flex-direction:column;
  }
  .bar{
    position:relative;height:var(--bar-h);flex:0 0 auto;display:flex;align-items:center;
    justify-content:space-between;gap:18px;
    padding:0 18px;background:var(--paper);border-bottom:1px solid var(--line);
  }
  .bar .brand{display:flex;align-items:center;min-width:0}
  .bar .brand span{
    font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--slate);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tabs{
    display:flex;gap:6px;
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  }
  .tab{
    appearance:none;border:1px solid var(--line);background:var(--mist);color:var(--slate);
    font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;
    padding:10px 18px;border-radius:4px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
  .open-link{
    margin-left:6px;display:inline-flex;align-items:center;gap:6px;
    color:var(--clay);text-decoration:none;font-weight:700;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;
  }
  .open-link:hover{color:var(--sage-2)}
  .views{flex:1 1 auto;position:relative;background:#fff}
  .views iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff;
  }
  .views iframe.active{display:block}
  @media(max-width:640px){
    .bar{gap:10px;padding:0 12px}
    .bar .brand span{display:none}
    .open-link span{display:none}
    .tab{padding:9px 10px;font-size:10px;letter-spacing:.08em;white-space:nowrap}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <span>Churchill's Boxing Gym · Site Review</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Site versions">
    <button class="tab" id="tab-original" role="tab" aria-selected="false" aria-controls="view-original">Original</button>
    <button class="tab" id="tab-new" role="tab" aria-selected="true" aria-controls="view-new">New Design</button>
    <button class="tab" id="tab-changes" role="tab" aria-selected="false" aria-controls="view-changes">What Changed</button>
  </nav>
  <a class="open-link" id="openLink" href="new-design.html" target="_blank" rel="noopener">↗ <span>Open in its own tab</span></a>
</header>

<main class="views" id="views">
  <iframe id="view-original" title="Original Churchill's Boxing Gym website"
          data-src="https://churchillsboxinggym.co.uk/" loading="lazy"></iframe>
  <iframe id="view-new" class="active" title="New Churchill's Boxing Gym design"
          src="new-design.html"></iframe>
  <iframe id="view-changes" title="What changed in the redesign and why"
          src="changes.html"></iframe>
</main>

<script>
  const tabs={
    original:{tab:document.getElementById('tab-original'),frame:document.getElementById('view-original'),href:'https://churchillsboxinggym.co.uk/'},
    new:{tab:document.getElementById('tab-new'),frame:document.getElementById('view-new'),href:'new-design.html'},
    changes:{tab:document.getElementById('tab-changes'),frame:document.getElementById('view-changes'),href:'changes.html'}
  };
  const openLink=document.getElementById('openLink');

  function activate(key,updateHash=true){
    for(const k in tabs){
      const on=k===key;
      tabs[k].tab.setAttribute('aria-selected',on);
      tabs[k].frame.classList.toggle('active',on);
    }
    // The original site is only loaded once the tab is first opened.
    const f=tabs[key].frame;
    if(f.dataset.src&&!f.src){f.src=f.dataset.src}
    openLink.href=tabs[key].href;
    if(updateHash)history.replaceState(null,'','#'+key);
  }

  for(const k in tabs){tabs[k].tab.addEventListener('click',()=>activate(k));}

  const initial=location.hash.replace('#','');
  activate(tabs[initial]?initial:'new',false);
</script>
</body>
</html>
